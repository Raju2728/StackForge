<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Stack Layers Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#primary-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Stacked Layers / Books / Tech Cards -->
  <g transform="translate(0, 10)">
    <!-- Bottom Layer (JS - Amber) -->
    <path d="M128 320 L256 384 L384 320 L256 256 Z" fill="url(#amber-grad)" opacity="0.85" />
    <path d="M128 320 L256 384 L256 404 L128 340 Z" fill="#d97706" opacity="0.9" />
    <path d="M384 320 L256 384 L256 404 L384 340 Z" fill="#b45309" opacity="0.9" />

    <!-- Middle Layer (CSS - Cyan/Purple) -->
    <path d="M128 250 L256 314 L384 250 L256 186 Z" fill="url(#accent-grad)" opacity="0.9" />
    <path d="M128 250 L256 314 L256 334 L128 270 Z" fill="#0284c7" opacity="0.95" />
    <path d="M384 250 L256 314 L256 334 L384 270 Z" fill="#0369a1" opacity="0.95" />

    <!-- Top Graduation Cap / Code Diamond Layer (HTML - Indigo/Purple Glow) -->
    <path d="M128 180 L256 244 L384 180 L256 116 Z" fill="url(#primary-grad)" filter="url(#glow)" />
    <path d="M128 180 L256 244 L256 264 L128 200 Z" fill="#4f46e5" />
    <path d="M384 180 L256 244 L256 264 L384 200 Z" fill="#4338ca" />
  </g>

  <!-- Code Brackets `< />` Overlay on Top Stack -->
  <g stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Bracket `<` -->
    <path d="M 205 160 L 170 180 L 205 200" opacity="0.95" />

    <!-- Slash `/` -->
    <path d="M 268 152 L 244 208" opacity="0.75" />

    <!-- Right Bracket `>` -->
    <path d="M 307 160 L 342 180 L 307 200" opacity="0.95" />
  </g>

  <!-- Sparkle / Graduation Star -->
  <path d="M 390 110 L 396 126 L 412 132 L 396 138 L 390 154 L 384 138 L 368 132 L 384 126 Z" fill="#fbbf24" />
</svg>
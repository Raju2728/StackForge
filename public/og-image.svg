<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Brand Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="150" r="260" fill="#6366f1" opacity="0.12" filter="url(#og-glow)" />
  <circle cx="1000" cy="450" r="300" fill="#a855f7" opacity="0.15" filter="url(#og-glow)" />
  <circle cx="600" cy="300" r="220" fill="#38bdf8" opacity="0.08" filter="url(#og-glow)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left: Brand Logo Block -->
  <g transform="translate(100, 110)">
    <!-- Squircle Logo Frame -->
    <rect x="0" y="0" width="130" height="130" rx="30" fill="#0f172a" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" />
    <circle cx="65" cy="65" r="45" fill="url(#primary-grad)" opacity="0.25" filter="url(#og-glow)" />
    
    <!-- Mini Stacked Icon -->
    <g transform="translate(15, 10) scale(0.2)">
      <path d="M128 320 L256 384 L384 320 L256 256 Z" fill="url(#amber-grad)" />
      <path d="M128 250 L256 314 L384 250 L256 186 Z" fill="url(#accent-grad)" />
      <path d="M128 180 L256 244 L384 180 L256 116 Z" fill="url(#primary-grad)" />
      <g stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 205 160 L 170 180 L 205 200" />
        <path d="M 268 152 L 244 208" />
        <path d="M 307 160 L 342 180 L 307 200" />
      </g>
    </g>
  </g>

  <!-- Tagline Badge -->
  <g transform="translate(260, 140)">
    <rect x="0" y="0" width="340" height="42" rx="21" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <circle cx="22" cy="21" r="5" fill="#10b981" />
    <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">COMPLETE FRONTEND ECOSYSTEM</text>
  </g>

  <!-- Title -->
  <text x="100" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#f8fafc" letter-spacing="-1">
    StackForge
  </text>
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
    From Zero to Building Real Websites
  </text>

  <!-- Subtitle -->
  <text x="100" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    HTML5 • CSS3 • Modern JavaScript • React Roadmap • Live Code Playground • Quizzes • Interview Prep
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(100, 495)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="200" height="48" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="24" y="30" font-family="sans-serif" font-size="18" fill="#e2e8f0">🧱 22 HTML Modules</text>

    <!-- Pill 2 -->
    <rect x="220" y="0" width="190" height="48" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="244" y="30" font-family="sans-serif" font-size="18" fill="#e2e8f0">🎨 55 CSS Lessons</text>

    <!-- Pill 3 -->
    <rect x="430" y="0" width="200" height="48" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="454" y="30" font-family="sans-serif" font-size="18" fill="#e2e8f0">⚡ JavaScript Mastery</text>

    <!-- Pill 4 -->
    <rect x="650" y="0" width="180" height="48" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="674" y="30" font-family="sans-serif" font-size="18" fill="#e2e8f0">💼 100+ Q&amp;A Prep</text>

    <!-- Pill 5 -->
    <rect x="850" y="0" width="150" height="48" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="874" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#34d399">100% FREE</text>
  </g>

  <!-- URL Watermark -->
  <text x="1100" y="585" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="600" fill="#64748b">
    stack-learner.vercel.app
  </text>
</svg>
